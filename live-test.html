<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIHF Live-Test 2</title>
<style>
body { font-family: sans-serif; background:#0b1a2e; color:#fff; padding:16px; }
button { font-size:18px; padding:12px 16px; border-radius:8px; border:0; background:#1e6fd9; color:#fff; }
#status { font-size:18px; margin:12px 0; padding:10px; background:#13294a; border-radius:8px; }
pre { white-space:pre-wrap; word-break:break-all; background:#000; padding:10px; border-radius:8px; font-size:12px; }
</style>
</head>
<body>
<h2>SIHF Live-Test 2</h2>
<button onclick="testen()">Test starten</button>
<div id="status">Noch kein Test gestartet.</div>
<pre id="ausgabe"></pre>

<script>
function testen() {
const status = document.getElementById("status");
const ausgabe = document.getElementById("ausgabe");
status.textContent = "Test läuft …";
ausgabe.textContent = "";
const name = "antwort" + Date.now();
let fertig = false;

window[name] = function (d) {
fertig = true;
status.textContent = "ERFOLG – Daten erhalten";
const teil = {
schluessel: Object.keys(d),
header: d.header,
anzahlSpiele: d.data ? d.data.length : 0,
ersteDreiSpiele: d.data ? d.data.slice(0, 3) : null
};
ausgabe.textContent = JSON.stringify(teil, null, 1);
delete window[name];
};

const s = document.createElement("script");
s.src = "https://data.sihf.ch/statistic/api/cms/table?alias=results&searchQuery=1//1&language=de&callback=" + name;
s.onerror = function () { if (!fertig) status.textContent = "FEHLER – keine Verbindung"; };
document.body.appendChild(s);
setTimeout(function () { if (!fertig) status.textContent = "KEINE ANTWORT nach 10 Sekunden"; }, 10000);
}
</script>
</body>
</html>
