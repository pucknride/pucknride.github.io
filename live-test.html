<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SIHF Live-Test</title>

<style>

  body { font-family: sans-serif; background:#0b1a2e; color:#fff; padding:16px; }

  button { font-size:18px; padding:12px 16px; margin:6px 6px 6px 0; border-radius:8px; border:0; background:#1e6fd9; color:#fff; }

  #status { font-size:18px; margin:12px 0; padding:10px; background:#13294a; border-radius:8px; }

  pre { white-space:pre-wrap; word-break:break-all; background:#000; padding:10px; border-radius:8px; font-size:12px; max-height:60vh; overflow:auto; }

</style>

</head>

<body>

<h2>SIHF Live-Test</h2>

<button onclick="testen('A')">Test A</button>

<button onclick="testen('B')">Test B</button>

<button onclick="testen('C')">Test C</button>

<div id="status">Noch kein Test gestartet.</div>

<pre id="ausgabe"></pre>

 

<script>

const BASIS = "https://data.sihf.ch/statistic/api/cms/table";

const VARIANTEN = {

  A: "alias=results&searchQuery=1/2027/&filterQuery=&orderBy=gameLocalTime&orderByDescending=false&take=20&language=de",

  B: "alias=results&searchQuery=1//1&language=de",

  C: "alias=results&language=de"

};

 

function testen(v) {

  const status = document.getElementById("status");

  const ausgabe = document.getElementById("ausgabe");

  status.textContent = "Test " + v + " läuft …";

  ausgabe.textContent = "";

  const name = "antwort" + v + Date.now();

  let fertig = false;

 

  window[name] = function (daten) {

    fertig = true;

    status.textContent = "Test " + v + ": ERFOLG – Daten erhalten";

    ausgabe.textContent = JSON.stringify(daten, null, 1).slice(0, 3000);

    delete window[name];

  };

 

  const s = document.createElement("script");

  s.src = BASIS + "?" + VARIANTEN[v] + "&callback=" + name;

  s.onerror = function () {

    if (!fertig) status.textContent = "Test " + v + ": FEHLER – keine Verbindung oder Anfrage abgelehnt";

  };

  document.body.appendChild(s);

 

  setTimeout(function () {

    if (!fertig) status.textContent = "Test " + v + ": KEINE ANTWORT nach 10 Sekunden";

  }, 10000);

}

</script>

</body>

</html>
